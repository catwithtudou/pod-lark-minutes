<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">pod-lark-minutes overview</title>
  <desc id="desc">A workflow diagram showing podcast and media URLs becoming Feishu or Lark Minutes through local audio download, Drive upload, and Minutes creation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="55%" stop-color="#f6fbf9"/>
      <stop offset="100%" stop-color="#fffaf2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#20b486"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#587083"/>
    </marker>
    <style>
      .title { font: 700 48px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #142536; }
      .subtitle { font: 400 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526678; }
      .label { font: 700 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #182b3c; }
      .detail { font: 400 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6f80; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #395166; }
      .card { fill: #ffffff; stroke: #dbe6ef; stroke-width: 1.5; }
      .line { stroke: #587083; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="520" rx="38" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="120" fill="#e7f3ff" opacity="0.8"/>
  <circle cx="118" cy="430" r="95" fill="#eaf8f0" opacity="0.9"/>

  <text class="title" x="80" y="92">pod-lark-minutes</text>
  <text class="subtitle" x="80" y="132">Create Feishu/Lark Minutes from podcast and media URLs.</text>

  <g transform="translate(80 196)" filter="url(#shadow)">
    <rect class="card" width="210" height="150" rx="22"/>
    <circle cx="52" cy="52" r="25" fill="#eef6ff" stroke="#bcd7f5"/>
    <path d="M43 40v29l27-14.5z" fill="#2f80ed"/>
    <text class="label" x="32" y="104">Media URL</text>
    <text class="detail" x="32" y="130">Xiaoyuzhou, RSS,</text>
    <text class="detail" x="32" y="150">or direct audio</text>
  </g>

  <path class="line" d="M314 271 H398"/>

  <g transform="translate(418 196)" filter="url(#shadow)">
    <rect class="card" width="210" height="150" rx="22"/>
    <rect x="31" y="31" width="44" height="44" rx="12" fill="#edf8f3" stroke="#bfe4d4"/>
    <path d="M43 54h20M53 44v20" stroke="#20a36b" stroke-width="5" stroke-linecap="round"/>
    <text class="label" x="32" y="104">Local Audio</text>
    <text class="detail" x="32" y="130">Resolve metadata</text>
    <text class="detail" x="32" y="150">and download media</text>
  </g>

  <path class="line" d="M652 271 H736"/>

  <g transform="translate(756 196)" filter="url(#shadow)">
    <rect class="card" width="210" height="150" rx="22"/>
    <rect x="31" y="33" width="51" height="38" rx="9" fill="#fff5df" stroke="#f1cd87"/>
    <path d="M42 33l9-12h22l9 12" fill="none" stroke="#d19020" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="32" y="104">Lark Drive</text>
    <text class="detail" x="32" y="130">Upload with</text>
    <text class="mono" x="32" y="151">drive +upload</text>
  </g>

  <path class="line" d="M990 271 H1064"/>

  <g transform="translate(884 365)">
    <rect width="196" height="48" rx="24" fill="url(#accent)"/>
    <text x="98" y="31" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">file_token</text>
  </g>

  <g transform="translate(970 196)" filter="url(#shadow)">
    <rect class="card" width="160" height="150" rx="22"/>
    <circle cx="55" cy="53" r="24" fill="#f0f2ff" stroke="#c9d0f8"/>
    <path d="M45 55l8 8 18-22" fill="none" stroke="#5964d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="32" y="104">Minutes</text>
    <text class="detail" x="32" y="130">Transcript and</text>
    <text class="detail" x="32" y="150">smart summary</text>
  </g>

  <g transform="translate(80 404)">
    <rect width="628" height="50" rx="25" fill="#ffffff" stroke="#dbe6ef"/>
    <text class="mono" x="28" y="31">pod-lark-minutes "&lt;url&gt;" --cleanup</text>
  </g>
</svg>
